name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  # 编译期不连库：依赖仓库内的 .sqlx 离线缓存
  SQLX_OFFLINE: 'true'
  RUST_BACKTRACE: '1'

jobs:
  # 1. 静态检查
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r check
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .

  # 2. 单元测试 + 契约测试 + 前端单测
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -- --test-threads=2

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  # 3. 构建
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  # 4. 依赖漏洞扫描
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # 5. 契约检查：目录规范 + 扩展点契约套件
  contract-check:
    name: contract-check
    runs-on: ubuntu-latest
    # CI 在境外，直接用官方镜像地址，不需要国内镜像前缀
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: base
          POSTGRES_PASSWORD: base
          POSTGRES_DB: base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U base -d base_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://base:base@127.0.0.1:5432/base_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: 校验业务模块目录规范
        run: cargo xtask check-modules
      - name: 扩展点契约测试
        run: cargo test -p platform-contracts -- --test-threads=2
      - name: 校验 compose 文件
        run: docker compose -f compose.yaml config --quiet
