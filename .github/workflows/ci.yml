name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
    # review_requested：请求评审时也要跑一次，让「强制人工评审」门禁有初始状态
    types: [opened, synchronize, reopened, review_requested]
  # 评审事件：评审者批准后必须能重跑门禁，否则 core-change-review 永远停在旧状态
  # （本仓库无 remote 时无法实跑验证，判定逻辑见 feature-meta/verification-report.md）
  pull_request_review:
    types: [submitted, edited, dismissed]

env:
  CARGO_TERM_COLOR: always
  # 编译期不连库：依赖仓库内的 .sqlx 离线缓存
  SQLX_OFFLINE: 'true'
  RUST_BACKTRACE: '1'

jobs:
  # 1. 静态检查
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r check
      - run: pnpm exec eslint .
      - run: pnpm exec prettier --check .

  # 2. 单元测试 + 契约测试 + 前端单测
  #
  # ⚠️ 这里必须有 postgres service：
  #   `platform-config` / `platform-org` 等套件里有需要真实数据库的用例，
  #   缺 `DATABASE_URL_TEST` 时它们会 **panic**（不是 skip）→ 本 job 必红。
  #   本地无库时用 `./scripts/test-integration.sh`（它自己处理这个降级）。
  #
  # ⚠️ 前端必须先 `pnpm -r build` 再 `pnpm -r test`：
  #   `packages/sdk/test/packaging.test.ts` 用 `describe.skipIf(!built)` 守着
  #   AC-S-075 的**产物边界**（dist 内容）。`dist` 被 gitignore，不先 build 就
  #   全部 skip —— 那 2 条**看起来在、实际不跑**（假绿）。
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: base
          POSTGRES_PASSWORD: base
          POSTGRES_DB: base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U base -d base_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://base:base@127.0.0.1:5432/base_test
      DATABASE_URL_TEST: postgres://base:base@127.0.0.1:5432/base_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # 需要真实库的套件要求平台表已建好
      - name: 迁移 up（测试库）
        run: cargo run --locked -p platform-server --bin base -- migrate up
      - run: cargo test --workspace -- --test-threads=2

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

  # 2b. 集成测试：把上面 test job **跑不到**的 `#[ignore]` 用例跑起来
  #
  # 为什么必须有这个 job：
  #   `cargo test --workspace` **不会跑 `#[ignore]` 的用例**，而需要真实库的套件
  #   全部标了 `#[ignore]` —— 共 **80 条**，包括：
  #     platform-rbac/tests/rbac_real_db.rs      22 条（RBAC 判定核心）
  #     platform-iam/tests/iam_real_db.rs        15 条（认证核心）
  #     platform-org/tests/org_real_db.rs        14 条（组织核心）
  #     platform-rbac/tests/me_permissions.rs    10 条（REQ-011 的 AC-S-064/065 验收）
  #   **没有这个 job，上面这些在 CI 上等于不存在。**
  #
  # 用仓库的 canonical 脚本（它会重置库、建应用角色、再用 `--include-ignored` 跑），
  # 与本地开发者跑的是**同一条路径**（D85：测试与生产/本地必须走同一个入口）。
  #
  # ⚠️ 已知：本 job 的「主机直连 psql」分支在开发机（无 psql）上**未实测**，
  #    本地走的是 podman 分支。首次真跑时若此处失败，优先看这一处。
  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: base
          POSTGRES_PASSWORD: base
          POSTGRES_DB: base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U base -d base_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL_TEST: postgres://base:base@127.0.0.1:5432/base_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # psql 是硬依赖：脚本在 CI 环境**拒绝**静默跳过库重置（见 scripts/test-integration.sh
      # 的 cannot_reset），没有 psql 会直接失败。显式装，不赌 runner 镜像预装了什么。
      - name: 安装 psql 客户端
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - run: ./scripts/test-integration.sh

  # 3. 构建
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

  # 4. 依赖漏洞扫描
  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: rustsec/audit-check@v2
        # rustsec/audit-check@v2 不接受 token 输入；需要鉴权走 RUSTEC_AUDIT_TOKEN 环境变量

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  # 5. 契约检查：目录规范 + 扩展点契约套件
  contract-check:
    name: contract-check
    runs-on: ubuntu-latest
    # CI 在境外，直接用官方镜像地址，不需要国内镜像前缀
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: base
          POSTGRES_PASSWORD: base
          POSTGRES_DB: base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U base -d base_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://base:base@127.0.0.1:5432/base_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - name: 校验业务模块目录规范
        run: cargo xtask check-modules
      - name: 扩展点契约测试
        run: cargo test -p platform-contracts -- --test-threads=2
      - name: 业务模块契约测试
        run: cargo test -p sandbox -- --test-threads=2
      - name: 校验 compose 文件（开发）
        run: docker compose -f compose.yaml config --quiet
      # 私有化 compose 用 env_file 注入配置，docker compose 找不到该文件会直接报错，
      # 因此校验前先放一份样例（.env 不入库，只在 CI 里临时生成）
      - name: 准备私有化部署的 .env（校验用）
        run: cp .env.example deploy/.env
      - name: 校验 compose 文件（私有化）
        env:
          # 私有化 compose 的生产口令**没有默认值**（${POSTGRES_PASSWORD:?…}），
          # 缺失时 compose 解析阶段就报错退出 —— 校验时必须显式给一个值。
          # 这是 CI 专用的占位值，不是任何环境的真实口令。
          POSTGRES_PASSWORD: ci-validation-only-not-a-real-secret
        run: docker compose -f deploy/compose.prod.yaml config --quiet
      - name: 校验 Helm Chart
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Helm lint 与模板渲染
        run: |
          helm lint deploy/helm/base-platform
          helm template base-platform deploy/helm/base-platform > /dev/null

  # 6. E2E（Playwright）：前端链路不依赖 Rust 后端常驻
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: pnpm install --frozen-lockfile
      # 低配机只装 chromium，不装全套浏览器
      - run: pnpm exec playwright install --with-deps chromium
      - run: bun run test:e2e

  # 7. 迁移：up → 校验 → down（回到空 schema）→ 再 up（AC-S-006）
  #
  # 迁移进 CI：可回滚性必须每次发布前验证，不能靠人工记忆。
  migration-test:
    name: migration-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: base
          POSTGRES_PASSWORD: base
          POSTGRES_DB: base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U base -d base_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://base:base@127.0.0.1:5432/base_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 下面几步都要用 psql 直接查库；显式装，不赌 runner 镜像预装了什么。
      - name: 安装 psql 客户端
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: 迁移 up
        run: cargo run --locked -p platform-server --bin base -- migrate up
      - name: 校验平台表已建立
        run: |
          count=$(psql -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='platform_meta'")
          echo "platform_meta 表数量：$count"
          [ "$count" = "1" ]
      - name: 迁移 down（回到空 schema）
        run: cargo run --locked -p platform-server --bin base -- migrate down --target 0
      - name: 校验 down 之后平台表已删除
        run: |
          count=$(psql -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='platform_meta'")
          echo "platform_meta 表数量：$count"
          [ "$count" = "0" ]
      - name: 迁移 up（可重复执行）
        run: cargo run --locked -p platform-server --bin base -- migrate up

  # 8. 构建镜像：多阶段 Dockerfile（builder / frontend / runtime）
  #
  # ⚠️ CI 在境外：基础镜像一律用**官方地址**（rust:lld / node / debian），
  #    不要加国内镜像前缀（国内直连 docker.io 超时那是本机问题，见 docs/dev-environment.md）。
  build-image:
    name: build-image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: base
          POSTGRES_PASSWORD: base
          POSTGRES_DB: base_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U base -d base_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: base-platform:ci
          build-args: |
            CARGO_BUILD_JOBS=2
            NPM_REGISTRY=https://registry.npmjs.org/
      - name: 镜像体积检查（目标 < 100MB）
        run: |
          size=$(docker image inspect base-platform:ci --format '{{.Size}}')
          echo "镜像大小：$((size / 1024 / 1024)) MB（上限 100 MB）"
          if [ "$size" -gt $((100 * 1024 * 1024)) ]; then
            echo "::error::镜像超过 100MB 目标"
            exit 1
          fi
      - name: 迁移 up（容器内）
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://base:base@127.0.0.1:5432/base_test \
            base-platform:ci migrate up
      - name: 冒烟：健康检查端点
        run: |
          docker run -d --name base-ci --network host \
            -e DATABASE_URL=postgres://base:base@127.0.0.1:5432/base_test \
            base-platform:ci
          for _ in $(seq 1 30); do
            if docker exec base-ci /usr/local/bin/base healthcheck; then
              break
            fi
            sleep 2
          done
          docker exec base-ci /usr/local/bin/base healthcheck
          docker exec base-ci /usr/local/bin/base healthcheck --url http://127.0.0.1:8080/health/live
          docker logs base-ci

  # 9. 镜像漏洞扫描（依赖漏洞扫描 job 的镜像侧）
  image-scan:
    name: image-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建待扫描镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: base-platform:scan
          build-args: |
            CARGO_BUILD_JOBS=2
            NPM_REGISTRY=https://registry.npmjs.org/
      - name: 扫描镜像漏洞
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: base-platform:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # 10. 护栏：能力索引一致性 + 依赖方向单向 + 契约快照一致性
  guardrails:
    name: guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要拿到 BA 分支（demand）才能校验契约快照
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      # 索引必须与源码一致：手改 capabilities/ 即失败（AC-S-004）
      - name: 校验能力索引与源码一致
        run: cargo xtask capabilities --check
      # 依赖方向单向：平台 crate 不得反向依赖业务模块
      - name: 校验依赖方向
        run: cargo xtask check-deps
      # 契约快照必须与 BA 分支的正本一致
      # （不一致就同步：scripts/sync-contracts.sh --sync）
      # ⚠️ 拿不到 demand 分支时脚本**明确失败**（退出码 2），不再静默跳过：
      #    静默跳过会让这道门禁空转，快照漂移了也没人知道。
      - name: 拉取 BA 正本分支
        run: git fetch --no-tags origin demand
      - name: 校验契约快照与 BA 正本一致
        run: ./scripts/sync-contracts.sh

  # 11. 平台核心变更：自动打标
  #
  # 触发条件：PR 改动了 crates/platform-core/ / crates/platform-contracts/ /
  # crates/platform-contracts-macros/。
  # 本 job 只负责「打标 + 摘要」；真正的强制人工评审由
  # `core-change-review`（required check）与 `.github/CODEOWNERS` 共同保证。
  core-change-label:
    name: core-change-label
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检测平台核心变更
        id: core
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 共享脚本：merge-base 口径 + 核心路径清单（清单与 core-change-review 同源）
          changed=$(./scripts/core-change-detect.sh)
          if [ -n "$changed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### 平台核心变更"
              echo ""
              echo "以下路径被修改，按 \`.github/CODEOWNERS\` 必须由核心维护者人工评审："
              echo ""
              echo '```'
              echo "$changed"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: 打上 platform-core-change 标签
        if: steps.core.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create platform-core-change \
            --description "修改了平台核心，需要核心维护者人工评审" \
            --color B60205 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label platform-core-change

  # 12. 平台核心变更：强制人工评审
  #
  # 判定口径：PR 改了平台核心路径时，必须存在一条
  # 「批准（approved）+ 评审人不是 PR 作者 + 评审的 commit 就是当前 HEAD」的评审。
  # 作者自己批准不算数；推了新 commit 之后旧批准自动失效（commit_id 对不上）。
  #
  # 触发时机：PR 打开 / 更新 / 重新打开 / 请求评审，以及每次评审提交
  # （pull_request_review: submitted / edited / dismissed）。
  # 没有 pull_request_review 触发器时，评审者批准后 workflow 不会重跑，
  # 这个检查会永远停在「未批准」的旧状态，「强制评审」形同虚设。
  #
  # ⚠️ 以下两步**在仓库设置里、不在代码里**，必须人工配置，代码无法代劳：
  #   1. 把 `core-change-review` 设为 required check；
  #   2. 打开「Require review from Code Owners」（配合 .github/CODEOWNERS）。
  # 另外：GitHub 规定 pull_request_review 事件只在「工作流文件已存在于默认分支」时触发，
  # 所以本文件合并进默认分支（main）之后，评审触发的门禁才会生效。
  core-change-review:
    name: core-change-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: 核心变更必须有非作者的批准
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # 判定口径：merge-base(base 分支最新提交, PR head)。
          # 不用 pull_request.base.sha —— 它不随 base 前进，会把 base 上已合入的
          # 核心改动也算成本次 PR 的改动（偏严）。
          changed=$(./scripts/core-change-detect.sh)
          if [ -z "$changed" ]; then
            echo "本次 PR 未修改平台核心，无需核心评审。"
            exit 0
          fi
          echo "::warning::本 PR 修改了平台核心：$changed"
          approved=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --paginate \
            | jq -s --arg head "$HEAD_SHA" --arg author "$PR_AUTHOR" \
                '[add[] | select(.state == "APPROVED" and .commit_id == $head and .user.login != $author)] | length')
          if [ "$approved" -ge 1 ]; then
            echo "平台核心变更已由非作者评审者批准 ✓"
            exit 0
          fi
          echo "::error::本 PR 修改了平台核心（$changed），但当前 HEAD 上没有来自非 PR 作者的批准评审。"
