[package]
name = "sandbox"
description = "业务模块示例：扩展点实现与契约测试的标准范例"
# 业务模块版本独立于平台版本：manifest.json 必须与本版本一致（契约检查 C-1）
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# 业务模块的后端实现放在 backend/ 下
name = "sandbox"
path = "backend/src/mod.rs"

[dependencies]
anyhow.workspace = true
# 业务模块**可以**依赖 axum（它不是平台内部模块）—— 路由层要用。
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# 业务模块只依赖平台核心（扩展点 trait），不依赖平台内部模块
platform-core.workspace = true
# REQ-006：数据访问走 platform-db 的租户作用域入口（拿不到裸连接）
platform-db.workspace = true

[dev-dependencies]
# 契约测试套件随平台分发：业务模块只依赖 platform-contracts 即可获得契约测试
platform-contracts.workspace = true
# 真实库集成测试（REQ-006 的 C-3 真实库层）需要直接准备测试库：
# 建表、跑迁移、按 manifest 生成 RLS 策略。**仅测试用**，运行期依赖不受影响。
sqlx.workspace = true
tokio.workspace = true
# 契约测试要驱动 axum 路由（`ServiceExt::oneshot`），不连网络。
tower.workspace = true
http-body-util.workspace = true
