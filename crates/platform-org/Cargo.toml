[package]
name = "platform-org"
description = "用户与组织架构：组织树（邻接表 + 递归 CTE）、成员关系、SCIM 2.0 出站、LDAP/AD 入站、同步冲突队列"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# 平台核心：RequestContext（租户的唯一来源）+ 扩展点 trait
platform-core.workspace = true
# 平台数据访问层：租户作用域入口（**不得**直连连接池）
platform-db.workspace = true
# 认证与账号体系（REQ-007）：离职禁用要**撤销全部会话与 refresh family**，
# 且账号状态 / 汇报关系挂在同一张用户表上 —— 没有别的途径拿到这些能力。
platform-iam.workspace = true
# HTTP 层：路由与中间件
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
uuid.workspace = true
time.workspace = true
# LDAP/AD 入站（REQ-008 D7）。
# ⚠️ **必须** `default-features = false`：默认特性带 `tls`（native-tls → openssl-sys），
#    私有化部署机常常没有 OpenSSL 开发包；而且 TLS 后端会拉进 ring / aws-lc-rs
#    （本期依赖预算明确要求两者 0 命中）。本期 LDAP 只走明文 ldap://。
ldap3 = { workspace = true }
# SCIM 出站：复用树里已有的 HTTP 栈，**不引 reqwest**（依赖预算）。
# ⚠️ `hyper-util` 的 `client-legacy` 特性在本仓库已有所需的传递依赖
#    （tower-service / pin-project-lite / futures-util / http-body-util 均已在锁文件里），
#    打开它**不新增任何 crate**。
hyper = { workspace = true }
hyper-util = { workspace = true }
http = { workspace = true }
# http_body_util::Full 的载荷类型（已在锁文件里，不新增 crate）。
bytes = { workspace = true }
http-body-util = { workspace = true }

[dev-dependencies]
# 直接驱动 axum Router（不连网络）：`ServiceExt::oneshot`
tower = { workspace = true }
# 读响应体
http-body-util.workspace = true
# 真实库集成测试：跑迁移、清夹具、查 RLS。**仅测试用**。
sqlx.workspace = true
uuid.workspace = true
time.workspace = true
