[package]
name = "xtask"
description = "底座工程任务运行器：目录规范校验等"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
# cargo metadata 的输出解析
serde.workspace = true
serde_json.workspace = true
# manifest 的 Schema 校验复用平台核心的解析器，避免两套实现
platform-core.workspace = true
# 租户作用域策略的统一生成 / 校验（复用平台数据访问层的 RLS 逻辑）
platform-db.workspace = true
# audit 子命令要复用平台审计的链校验 / 归档服务（REQ-014 AC-S-022 / AC-S-131）
platform-audit.workspace = true
# 通知投递批处理（REQ-015 / D296）：`xtask notify worker`
platform-notify.workspace = true
# 「列出全部租户」需要一条**不带租户上下文**的查询（RLS 下管理员连接才看得到行）
sqlx.workspace = true
# tenant-policies 子命令要连库（异步）
tokio.workspace = true

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"
