[package]
name = "platform-server"
description = "交付基线服务：部署期配置校验、健康检查探针、数据库迁移与前端静态托管"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
clap.workspace = true
anyhow.workspace = true
# 复用平台核心的请求上下文（健康检查响应带 traceId）
platform-core.workspace = true
# 平台数据访问层：租户隔离前提自检（require_isolation）+ 部署期 RLS 策略生成
platform-db.workspace = true
# 认证与账号体系（REQ-007）：/api/iam/* 路由 + JWKS + 租户上下文中间件
platform-iam.workspace = true
# 用户与组织架构（REQ-008）：/api/org/* 路由 + 组织树 / 成员关系 / SCIM / LDAP
platform-org.workspace = true
platform-rbac.workspace = true
# 配置、品牌与 Feature Flag（REQ-010）：/api/config/* + /api/feature-flags/*
platform-config.workspace = true
# 元数据读取接口（REQ-012）：/api/schema/<module>/<entity>
platform-schema.workspace = true
# 业务模块装配（REQ-012 D103）：编译期注册的模块必须在**装配层**被链接进来，
# 否则 inventory 里没有它 —— 只在测试里存在 = 服务里 404。
sandbox.workspace = true
# 部署期数据库客户端：迁移 + 健康检查；不承担业务数据访问
sqlx.workspace = true

[lib]
name = "platform_server"
path = "src/lib.rs"

[[bin]]
name = "base"
path = "src/main.rs"

[dev-dependencies]
# 路由层的行为测试要驱动 axum 路由（`ServiceExt::oneshot`），不连网络、不起端口。
# 两者都已在工作区锁文件里（`platform-config` / `platform-iam` 的测试用同一套），
# dev-only → 不改变生产依赖树。
tower.workspace = true
http-body-util.workspace = true
