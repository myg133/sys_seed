[workspace]
resolver = "2"
members = [
    "crates/platform-core",
    "crates/platform-config",
    "crates/platform-contracts",
    "crates/platform-contracts-macros",
    "crates/platform-db",
    "crates/platform-iam",
    "crates/platform-org",
    "crates/platform-rbac",
    "crates/platform-server",
    "crates/xtask",
    "modules/sandbox",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
platform-core = { path = "crates/platform-core" }
platform-config = { path = "crates/platform-config" }
platform-contracts = { path = "crates/platform-contracts" }
platform-contracts-macros = { path = "crates/platform-contracts-macros" }
platform-db = { path = "crates/platform-db" }
platform-iam = { path = "crates/platform-iam" }
platform-org = { path = "crates/platform-org" }
platform-rbac = { path = "crates/platform-rbac" }
platform-server = { path = "crates/platform-server" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }
# 编译期注册：本期唯一新增的第三方依赖（约 3KB，无额外传递依赖）
inventory = "0.3"
# 部署期数据库客户端：只用于健康检查与迁移，不承担业务数据访问
# （业务数据访问层仍待 REQ-006/007，见 AGENTS.md「尚未提供」段）。
# 关掉默认特性里的 macros/json，避免拉进 proc-macro 编译链：低配机编译开销敏感。
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "migrate",
    # `time`：timestamptz ↔ time::OffsetDateTime（契约 C13：时间一律 UTC 存 timestamptz）。
    # 只多一个 time-macros proc-macro crate，不开 sqlx 的 macros feature。
    "time",
] }

# ---------------------------------------------------------------------------
# REQ-007：认证与账号体系（安全模块的依赖例外，见 design-summary §8）
# ---------------------------------------------------------------------------
# 密码哈希：Argon2id（PHC 标准串）。纯 Rust，无 C/汇编。
argon2 = "0.5"
# JWT：签发 / 验签 / JWKS。
# ⚠️ **必须** `default-features = false` + `rust_crypto`：
#    默认的 ring / aws-lc-rs 后端要编 C/汇编，在低配机上又慢又吃内存；
#    `rust_crypto` 走纯 Rust 的 rsa / ecdsa / p256。
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
# TOTP：HMAC-SHA1 + base32。纯 Rust。
# `otpauth` feature：`get_url()` 要用它（本期要返回 otpauth URI）。
totp-rs = { version = "5", features = ["otpauth"] }
# 随机数：refresh token / 恢复码 / TOTP secret 的熵源。
rand = "0.8"
# 摘要：refresh token / 重置令牌 / 恢复码的**哈希存储**（高熵值，不需要慢哈希）。
sha2 = "0.10"
# P-256：JWT 签名密钥的生成与公钥坐标（JWKS 需要 x / y）。
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "std"] }
# base64url：refresh token 与 JWKS 坐标的编码。
base64 = "0.22"
# AEAD：TOTP secret 的**静态加密**（密钥只从环境注入）。
# ⚠️ 不自制密码学 —— 用成熟库（design-summary §3「安全模块不省依赖」）。
chacha20poly1305 = "0.11"

# 测试用：直接驱动 axum Router（`ServiceExt::oneshot`），不连网络。
tower = { version = "0.5", features = ["util"] }
# 读 axum 响应体。
http-body-util = "0.1"

# ---------------------------------------------------------------------------
# REQ-008：用户与组织架构（SCIM 出站 / LDAP 入站）
# ---------------------------------------------------------------------------
# LDAP/AD 入站（design-summary §4）。
# ⚠️ **必须** `default-features = false`：默认特性带 `tls`（native-tls → openssl-sys，
#    私有化机常常没有 OpenSSL 开发包），而且 TLS 后端会拉进 ring / aws-lc-rs
#    —— 本期依赖预算要求两者 0 命中。本期 LDAP 只走明文 ldap://。
ldap3 = { version = "0.11", default-features = false }
# SCIM 出站：**复用树里已有的 HTTP 栈**，不引 reqwest。
# ⚠️ `hyper-util` 的 `client-legacy` 特性所需的传递依赖（tower-service /
#    pin-project-lite / futures-util / http-body-util / socket2）**全部已在锁文件里**，
#    打开它不新增任何 crate。
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
http = "1"
# http_body_util::Full 的载荷类型（已在锁文件里，不新增 crate）。
bytes = "1"

# 低配开发基线：见 docs/dev-environment.md 与 BA/plan/dev-guide-low-spec.md
# 第三方依赖一律不优化、不带调试信息，省编译时间与磁盘。
[profile.dev.package."*"]
opt-level = 0
debug = 0

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
