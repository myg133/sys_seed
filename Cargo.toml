[workspace]
resolver = "2"
members = [
    "crates/platform-core",
    "crates/platform-contracts",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
platform-core = { path = "crates/platform-core" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting"] }

# 低配开发基线：见 docs/dev-environment.md 与 BA/plan/dev-guide-low-spec.md
# 第三方依赖一律不优化、不带调试信息，省编译时间与磁盘。
[profile.dev.package."*"]
opt-level = 0
debug = 0

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 16
strip = "debuginfo"
