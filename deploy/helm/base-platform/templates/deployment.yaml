apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "base-platform.fullname" . }}
  labels:
    {{- include "base-platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "base-platform.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        # 滚动时若配置变更，重新拉起实例
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "base-platform.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "base-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: app
          image: {{ include "base-platform.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          # ⚠️ **不用 `envFrom` 整包注入**：Secret 里含
          #    `MIGRATION_DATABASE_URL`（**超级用户**连接串）与 `APP_ROLE_PASSWORD`，
          #    整包注入 = 应用 Pod 的环境变量里躺着超管凭据 ——
          #    Pod 一旦被拿下（环境变量泄露 / 崩溃转储 / 某个依赖读环境变量），
          #    攻击者就能拿超管连库，**RLS 被绕过 → 跨租户全量可读**，
          #    等于把「应用用普通角色」这层白做。
          #    所以下面逐个点名：只给应用真正需要的键。
          env:
            # 必填项单独点名：Secret 里缺 DATABASE_URL 时容器 fail-fast，
            # 这里显式声明让「谁提供」一目了然。
            #
            # ⚠️ 这里必须是**普通角色**的连接串：超级用户会绕过 PostgreSQL 的 RLS，
            #    租户隔离会 fail open。应用启动时会自检连接角色，绕过 RLS 就拒绝启动。
            - name: {{ .Values.secret.databaseUrlKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret }}
                  key: {{ .Values.secret.databaseUrlKey }}
            # 缓存（可选）：Secret 里没这个键也不该让 Pod 起不来
            # （键名 = 应用读的变量名，见 values.yaml 的 secret.redisUrlKey）
            - name: {{ .Values.secret.redisUrlKey }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret }}
                  key: {{ .Values.secret.redisUrlKey }}
                  optional: true
            # 非敏感运行配置：逐个列出来（不再整包 envFrom ConfigMap）
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # liveness：进程活着就过（不查数据库，避免数据库抖动导致误杀）
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # readiness：数据库连通 **且** 迁移已应用才接流量
          # （否则滚动更新时流量会打到还没迁移好的实例）
          #
          # timeoutSeconds 必须**大于**连接池的 acquire_timeout（当前 2s，
          # 见 crates/platform-server/src/db.rs 的 ACQUIRE_TIMEOUT）：
          # 数据库不可达时 /health/ready 要等满 acquire_timeout 才返回 503，
          # 探针超时若等于或小于它，kubelet 会先掐断请求，
          # 那个语义清晰的 503 / DATABASE_UNAVAILABLE 就进不了 K8s 事件。
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
