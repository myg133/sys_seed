{{- if .Values.migrate.enabled }}
{{/*
迁移 Job：独立步骤，install / upgrade 前由 Helm 自动跑。

- 不在 app 的启动流程里跑迁移：多副本并发迁移会冲突。
- pre-install / pre-upgrade hook：先迁移成功，再滚 app。
- hook-delete-policy: before-hook-creation —— 下次发布前清掉上次的 Job。
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "base-platform.fullname" . }}-migrate
  labels:
    {{- include "base-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade,pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": {{ .Values.migrate.hookDeletePolicy }}
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "base-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "base-platform.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "base-platform.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ['migrate', 'up']
          envFrom:
            # 只整包引用 **ConfigMap**（非敏感运行配置）。
            # Secret **不整包引用**：这个 Job 只需要超管连接串，
            # 逐个点名即可（多给的应用连接串与角色口令对这个 Job 没有用，
            # 少给反而更安全 —— 见 deployment.yaml 的同类说明）。
            - configMapRef:
                name: {{ include "base-platform.fullname" . }}
          env:
            # 迁移用**超级用户**连接：建表 / 建 policy 需要 DDL 权限。
            # （应用连接用的是普通角色，见 deployment.yaml）
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.existingSecret }}
                  key: {{ .Values.secret.migrationDatabaseUrlKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
